[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neff-retrieval"
version = "0.1.0"
description = "Effective sample size as a control variable for accuracy and calibration in retrieval-based inverse inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jaya Aditya" }]
keywords = ["inverse problems", "uncertainty quantification", "calibration", "effective sample size", "nearest neighbours"]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "scikit-learn>=1.2", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
neffretrieval = "neffretrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
